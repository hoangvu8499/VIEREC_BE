spring:
  config:
    # Machine-specific DB credentials, kept out of git (see .gitignore).
    import: optional:file:./application-local.yml
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false

logging:
  level:
    root: INFO
    com.vierec: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  seed-admin: false  # true = DataInitializer inserts a SUPER_ADMIN account (admin / Admin@123)
