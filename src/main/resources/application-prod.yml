spring:
  jpa:
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  level:
    root: WARN
    com.vierec: INFO

app:
  seed-admin: false
  cookie:
    secure: ${COOKIE_SECURE:true}   # prod is served over HTTPS
