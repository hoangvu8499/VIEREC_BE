# =====================================================================
# Base configuration. Environment-specific overrides live in
# application-{dev,prod}.yml; pick one with SPRING_PROFILES_ACTIVE.
# =====================================================================
spring:
  application:
    name: VIEREC_BE
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vierec?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: vierec-pool
      # Requests hold a connection only for their short transactions; 20 serves ~500 concurrent users.
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false        # fail loudly on lazy loading outside a transaction
    hibernate:
      ddl-auto: validate       # schema is managed by hand (DB.sql); Hibernate must never change it
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        # Lazy associations of a page of rows load in one IN (...) query instead of one query per row.
        default_batch_fetch_size: 100
        query:
          in_clause_parameter_padding: true
        jdbc:
          batch_size: 50
          time_zone: Asia/Ho_Chi_Minh
        order_inserts: true
        order_updates: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: Asia/Ho_Chi_Minh

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false      # required for the 404 above to reach the handler

  # SMTP for password reset codes (Gmail app password, Zoho, SendGrid...). Empty host: emails go to the log.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  servlet:
    multipart:
      # Hard ceiling checked by the container; the per-type limit is app.upload.max-document-size.
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:60MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:70MB}

server:
  port: ${SERVER_PORT:8383}
  shutdown: graceful
  tomcat:
    threads:
      max: ${SERVER_MAX_THREADS:200}
      min-spare: 20
    accept-count: 200
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    mail:
      enabled: false           # an unreachable SMTP server must not mark the whole app DOWN
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ---------------------------------------------------------------- app
app:
  info:
    version: 1.0.0
  jwt:
    # Override in every real environment. Must be >= 32 chars for HS256.
    secret: ${JWT_SECRET:change-me-this-is-a-dev-only-secret-key-32b}
    access-token-validity-ms: ${JWT_ACCESS_TTL:1800000}        # 30 minutes
    refresh-token-validity-ms: ${JWT_REFRESH_TTL:2592000000}   # 30 days
    issuer: vierec-be
  cookie:
    # Tokens travel only in HttpOnly cookies, never in a response body.
    access-token-name: access_token
    refresh-token-name: refresh_token
    # Refresh cookie is only sent to the auth endpoints, not with every API call.
    refresh-token-path: /api/v1/auth
    secure: ${COOKIE_SECURE:false}       # true in prod: cookies only over HTTPS
    same-site: ${COOKIE_SAME_SITE:Lax}   # Lax blocks cross-site POSTs (CSRF) but allows same-site front-ends
    domain: ${COOKIE_DOMAIN:}            # empty = host-only cookie
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8484}
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:8484}   # printed in the QR code of generated certificates
  mail:
    from: ${MAIL_FROM:VIEREC Academy <no-reply@vierec.vn>}
  geocoding:
    # OpenStreetMap Nominatim: free, no key; needs a real User-Agent, max 1 request/second.
    base-url: ${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org/search}
    user-agent: ${GEOCODING_USER_AGENT:VIEREC-Academy/1.0}
    country-codes: vn
    timeout: 5s
  upload:
    dir: ${UPLOAD_DIR:./uploads}                        # uploaded files are stored here on the server
    max-document-size: ${UPLOAD_MAX_DOCUMENT_SIZE:50MB}
    # extension -> MIME type stored in files.content_type (the client's Content-Type is not trusted)
    document-types:
      pdf: application/pdf
      doc: application/msword
      docx: application/vnd.openxmlformats-officedocument.wordprocessingml.document
      ppt: application/vnd.ms-powerpoint
      pptx: application/vnd.openxmlformats-officedocument.presentationml.presentation
      xls: application/vnd.ms-excel
      xlsx: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      txt: text/plain
