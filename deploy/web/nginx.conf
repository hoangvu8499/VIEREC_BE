# Public entry point for upsc.vn: HTTPS, React static files, /api -> Spring Boot.
# Certificates come from the certbot container (Let's Encrypt), shared through the "letsencrypt" volume.

server_tokens off;
client_max_body_size 70m;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# Docker's internal DNS: re-resolve "app" so a restarted API container (new IP) is still found.
resolver 127.0.0.11 valid=10s ipv6=off;

# ---------- HTTP: Let's Encrypt challenge, everything else -> HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name upsc.vn www.upsc.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://upsc.vn$request_uri;
    }
}

# ---------- HTTPS www -> apex ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.upsc.vn;

    ssl_certificate     /etc/letsencrypt/live/upsc.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upsc.vn/privkey.pem;

    return 301 https://upsc.vn$request_uri;
}

# ---------- HTTPS main site ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name upsc.vn;

    ssl_certificate     /etc/letsencrypt/live/upsc.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upsc.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;

    # API only. Actuator and Swagger stay private because they are not under /api.
    location /api/ {
        set $api_upstream http://app:8383;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Stream uploads straight to the API instead of buffering 70 MB in nginx first.
        proxy_request_buffering off;
    }

    # Vite output has content hashes in file names: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # React SPA: unknown paths fall back to index.html for client-side routing.
    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
